<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทะเบียนเรือ จุดรวมเรือ ตำบลป่งขาม อำเภอหว้านใหญ่ จังหวัดมุกดาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef5f8;--card:#fff;--ink:#14323f;--mute:#5b7480;--line:#d4e2e9;--brand:#0b6e8a;--brand2:#0a4f66;--accent:#e8a33d;--soft:#e2f0f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1b21;--card:#16272f;--ink:#e6f1f5;--mute:#93aab5;--line:#25404c;--brand:#3fb2d1;--brand2:#7ed0e6;--accent:#f0b85a;--soft:#1c3641}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1b21;--card:#16272f;--ink:#e6f1f5;--mute:#93aab5;--line:#25404c;--brand:#3fb2d1;--brand2:#7ed0e6;--accent:#f0b85a;--soft:#1c3641}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",Tahoma,sans-serif;line-height:1.55}
.hero{background:linear-gradient(135deg,#0a4f66,#0b6e8a 60%,#1b8fb0);color:#fff;padding:28px 18px 56px;text-align:center}
.hero small{opacity:.85;letter-spacing:.04em}
.hero h1{margin:6px 0 4px;font-size:clamp(1.4rem,4.5vw,2.2rem)}
.hero p{margin:0;opacity:.9}
.wrap{max-width:1100px;margin:-34px auto 40px;padding:0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px #0001}
.stat b{display:block;font-size:1.7rem;color:var(--brand)}.stat span{color:var(--mute);font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.bar input{flex:1 1 220px}.bar select{flex:0 1 180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{cursor:pointer;transition:transform .15s,box-shadow .15s;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0001}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.photos.one{grid-template-columns:1fr}
.photos figure{margin:0;background:var(--soft);position:relative}
.photos img{display:block;width:100%;height:auto}
.photos figcaption{position:absolute;left:6px;bottom:6px;background:#000a;color:#fff;font-size:.72rem;padding:1px 8px;border-radius:99px}
.body{padding:12px 14px 14px}
.reg{display:inline-block;background:var(--accent);color:#2a1b00;font-weight:700;border-radius:8px;padding:1px 10px}
.body h3{margin:8px 0 2px;font-size:1.08rem}
.row{color:var(--mute);font-size:.92rem;margin:2px 0}
.tag{display:inline-block;background:var(--soft);color:var(--brand2);border-radius:99px;padding:1px 10px;font-size:.82rem;margin-right:4px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:0 14px 24px}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0002}.card:focus-visible{outline:3px solid var(--brand)}
.more{margin-top:8px;color:var(--brand);font-weight:600;font-size:.9rem}
#dt{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:40;overflow-y:auto}
#dt.on{display:flex}
.dbox{position:relative;background:var(--card);color:var(--ink);border-radius:18px;width:min(560px,100%);padding:18px;margin:auto}
.dbox h2{margin:8px 0 10px;font-size:1.3rem}
.dbox .x{position:absolute;top:10px;right:10px;border:0;border-radius:99px;width:34px;height:34px;background:var(--soft);color:var(--brand2);font-size:1rem;cursor:pointer}
.dbox dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px}
.dbox dt{color:var(--mute)}.dbox dd{margin:0;font-weight:600;word-break:break-word}
.dbox a{color:var(--brand)}
.big{margin:0 0 10px;position:relative;background:var(--soft);border-radius:12px;overflow:hidden;cursor:zoom-in}
.big img{display:block;width:100%;height:auto}
.big figcaption{position:absolute;left:8px;bottom:8px;background:#000a;color:#fff;font-size:.78rem;padding:1px 10px;border-radius:99px}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:16px;z-index:50;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>

<script>
(function(){
var S=JSON.parse(document.getElementById('data').textContent),B=S.boats||[],q='',ft='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ph(p){return S.showPhone?p:(p.length>4?p.slice(0,-4)+'XXXX':'XXXX')}
var types=[];B.forEach(function(b){if(types.indexOf(b.type)<0)types.push(b.type)});
function render(){
 var L=B.filter(function(b){var t=(b.reg+' '+b.name+' '+b.addr+' '+b.type).toLowerCase();return (!q||t.indexOf(q.toLowerCase())>-1)&&(!ft||b.type===ft)});
 var tot=B.reduce(function(a,b){return a+(+b.count||0)},0);
 var h='<header class="hero"><small>ฐานข้อมูลทะเบียนเรือ</small><h1>🚤 จุดรวมเรือ ตำบลป่งขาม</h1><p>อำเภอหว้านใหญ่ จังหวัดมุกดาหาร</p></header><div class="wrap">'+
 '<div class="stats"><div class="stat"><b>'+B.length+'</b><span>ผู้ลงทะเบียน (ราย)</span></div><div class="stat"><b>'+tot+'</b><span>จำนวนเรือทั้งหมด (ลำ)</span></div><div class="stat"><b>'+types.length+'</b><span>ประเภทเรือ</span></div></div>'+
 '';
 if(!L.length)h+='<div class="empty">'+(B.length?'ไม่พบข้อมูลที่ค้นหา':'ยังไม่มีข้อมูลทะเบียนเรือ')+'</div>';
 else h+='<div class="grid">'+L.map(function(b){
  var one=(b.ownerImg&&b.boatImg)?'':' one';
  var pics=(b.ownerImg?'<figure><img alt="เจ้าของเรือ" src="'+b.ownerImg+'"><figcaption>เจ้าของเรือ</figcaption></figure>':'')+(b.boatImg?'<figure><img alt="เรือ" src="'+b.boatImg+'"><figcaption>เรือ</figcaption></figure>':'');
  return '<article class="card" tabindex="0" data-id="'+esc(b.id)+'">'+'<div class="body"><span class="reg">'+esc(b.reg)+'</span><h3>'+esc(b.name)+'</h3><div class="row"><span class="tag">'+esc(b.type)+'</span><span class="tag">'+esc(b.count)+' ลำ</span></div><div class="row">📍 '+esc(b.addr)+'</div><div class="row">📞 '+esc(ph(b.phone))+'</div><div class="more">ดูรายละเอียด ›</div></div></article>'}).join('')+'</div>';
 h+='</div><footer>ข้อมูลทะเบียนเรือ จุดรวมเรือ ตำบลป่งขาม อำเภอหว้านใหญ่ จังหวัดมุกดาหาร</footer>';
 var f=document.activeElement&&document.activeElement.id==='q';
 document.getElementById('app').innerHTML=h;

 document.querySelectorAll('.card').forEach(function(c){c.onclick=function(){openDetail(c.dataset.id)};c.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(c.dataset.id)}}});
}
function closeDetail(){document.getElementById('dt').className='';document.getElementById('dt').innerHTML=''}
function openDetail(id){
 var b=B.find(function(x){return String(x.id)===String(id)});if(!b)return;
 var d=document.getElementById('dt');
 function im(s,c){return s?'<figure class="big"><img alt="'+c+'" src="'+s+'"><figcaption>'+c+'</figcaption></figure>':''}
 var tel=S.showPhone?'<a href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a>':esc(ph(b.phone));
 d.innerHTML='<div class="dbox"><button class="x" id="dx" aria-label="ปิด">✕</button><span class="reg">'+esc(b.reg)+'</span><h2>'+esc(b.name)+'</h2><dl><dt>ที่อยู่</dt><dd>'+esc(b.addr)+'</dd><dt>เบอร์โทรศัพท์</dt><dd>'+tel+'</dd><dt>ประเภทเรือ</dt><dd>'+esc(b.type)+'</dd><dt>จำนวนเรือ</dt><dd>'+esc(b.count)+' ลำ</dd></dl>'+im(b.ownerImg,'เจ้าของเรือ')+im(b.boatImg,'เรือ')+'</div>';
 d.className='on';
 document.getElementById('dx').onclick=closeDetail;
 d.onclick=function(e){if(e.target===d)closeDetail()};
 d.querySelectorAll('.big img').forEach(function(m){m.onclick=function(){var lb=document.getElementById('lb');lb.firstChild.src=m.src;lb.className='on'}});
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('lb').className='';closeDetail()}});
document.getElementById('lb').onclick=function(){this.className=''};
render();
})();
</script>
